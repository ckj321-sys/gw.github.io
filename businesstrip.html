<html>
	<head>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
	<script src="common.js"></script>
	<style>
		body{
			font-family:맑은 고딕;
			margin:30px;
		}

		table{
			border-collapse:collapse;
		}

		table tr th {
			background-color:#d9d9d9;
		}

		table tr, th, td {
			border-collapse:collapse;
			border:1px solid #000;padding:8px;
			text-align:center;
		}

		.header {
			font-weight:bold;
		}
		.border_edge {
			border-left: 3px solid;
			border-right: 3px solid;
		}
	</style>

	<script>


	window.onload = function(){

		const docId = getDocId();

		if (!docId) {
			alert("문서정보가 없습니다.");
			return;
		}

		const docs = getDocuments();
		const doc = docs.find(x => x.id === docId);

		if (!doc) {
			alert("문서를 찾을 수 없습니다.");
			return;
		}

		bindData(doc);

	};

	function bindData(doc){

		if(!doc)
			return;

		console.log(doc);
		
		document.getElementById("approvalNo").innerHTML = doc.data.approvalNo || "";
		document.getElementById("writeDate").innerHTML = doc.data.writeDate || "";
		document.getElementById("dept").innerHTML = doc.data.dept || "";
		document.getElementById("writer").innerHTML = doc.data.writer || "";
		document.getElementById("title").innerHTML = doc.data.title || "";
		document.getElementById("projectCode").innerHTML = doc.data.projectCode || "";
		document.getElementById("projectName").innerHTML = doc.data.projectName || "";
		document.getElementById("customerName").innerHTML = doc.data.customerName || "";
		document.getElementById("tripPlace").innerHTML = doc.data.tripPlace || "";
		document.getElementById("startDate").innerHTML = doc.data.startDate || "";
		document.getElementById("endDate").innerHTML = doc.data.endDate || "";
		document.getElementById("startDateTime").innerHTML = doc.data.startDateTime || "";
		document.getElementById("endDateTime").innerHTML = doc.data.endDateTime || "";
		document.getElementById("tripPurpose").innerHTML = doc.data.tripPurpose || "";
		document.getElementById("approver1").innerHTML = doc.data.approver1 || "";
		document.getElementById("approver2").innerHTML = doc.data.approver2 || "";
		document.getElementById("approver3").innerHTML = doc.data.approver3 || "";
		document.getElementById("approver4").innerHTML = doc.data.approver4 || "";
		document.getElementById("approver5").innerHTML = doc.data.approver5 || "";
		document.getElementById("approver6").innerHTML = doc.data.approver6 || "";

		const userName =  document.getElementById("approver1").innerHTML;

		document.getElementById("approver1_stamp").innerHTML = `
			<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 100 100">
				<circle cx="50" cy="50" r="48"
						fill="none"
						stroke="#c00000"
						stroke-width="3"/>

				<text x="50"
					y="60"
					text-anchor="middle"
					font-size="30"
					font-weight="bold"
					fill="#c00000"
					font-family="Malgun Gothic, sans-serif">
					${userName}
				</text>
			</svg>`;

	}

	function getValue(xml, tag){
		const node = xml.getElementsByTagName(tag)[0];
		return node ? node.textContent : "";
	}

	function setValue(id, value){

		const obj =	document.getElementById(id);
		
		if(!obj) return;
    	obj.textContent = value || '';
		
	}

	function rgbToArgb(rgb) {

		if (!rgb || rgb === 'rgba(0, 0, 0, 0)') {
			return null;
		}

		const match = rgb.match(/\d+/g);

		if (!match) {
			return null;
		}

		return (
			"FF" +
			Number(match[0]).toString(16).padStart(2, "0") +
			Number(match[1]).toString(16).padStart(2, "0") +
			Number(match[2]).toString(16).padStart(2, "0")
		).toUpperCase();
	}

	//엑셀 출력
	async function exportExcel() {

		const table = document.getElementById("tblData");

		const workbook = new ExcelJS.Workbook();
		const worksheet = workbook.addWorksheet("출장신청서");

		const occupied = {};

		function isOccupied(r, c) {
			return occupied[r + "_" + c];
		}

		function markOccupied(sr, sc, er, ec) {

			for (let r = sr; r <= er; r++) {
				for (let c = sc; c <= ec; c++) {
					if (r === sr && c === sc) {
						continue;
					}
					occupied[r + "_" + c] = true;
				}
			}
		}

		let excelRow = 1;

		Array.from(table.rows).forEach(function (tr) {

			let excelCol = 2;

			Array.from(tr.cells).forEach(function (td) {

				while (isOccupied(excelRow, excelCol)) {
					excelCol++;
				}

				const cell = worksheet.getCell(
					excelRow,
					excelCol
				);

				cell.value = td.innerText.trim();

				const style = window.getComputedStyle(td);

				// 폰트
				cell.font = {
					name: "맑은 고딕",
					size: 10,
					bold:
						style.fontWeight === "bold" ||
						parseInt(style.fontWeight) >= 700
				};

				// 정렬
				cell.alignment = {
					vertical: "middle",
					horizontal:
						style.textAlign === "left"
							? "left"
							: style.textAlign === "right"
							? "right"
							: "center",
					wrapText: true
				};

				// 배경색
				const bgColor = rgbToArgb(style.backgroundColor);

				if (bgColor) {

					cell.fill = {
						type: "pattern",
						pattern: "solid",
						fgColor: {
							argb: bgColor
						}
					};
				}

				// 기본 테두리
				cell.border = {
					top: { style: "thin" },
					left: { style: "thin" },
					bottom: { style: "thin" },
					right: { style: "thin" }
				};

				const colSpan = td.colSpan || 1;
				const rowSpan = td.rowSpan || 1;

				// 병합
				if (colSpan > 1 || rowSpan > 1) {

					worksheet.mergeCells(
						excelRow,
						excelCol,
						excelRow + rowSpan - 1,
						excelCol + colSpan - 1
					);

					markOccupied(
						excelRow,
						excelCol,
						excelRow + rowSpan - 1,
						excelCol + colSpan - 1
					);
				}
				excelCol += colSpan;
			});

			worksheet.getRow(excelRow).height = 25;
			
			excelRow++;
		});

		//첫째줄, 여백줄 높이설정
		worksheet.getRow(1).height = 60.75;
		worksheet.getRow(8).height = 8;
		worksheet.getRow(11).height = 8;
		worksheet.getRow(16).height = 267;
		
		//너비 설정
		worksheet.getColumn(1).width = 1.63;
		worksheet.getColumn(2).width = 10.38;
		worksheet.getColumn(3).width = 5.5;
		worksheet.getColumn(4).width = 10.63;
		worksheet.getColumn(5).width = 14.75;
		worksheet.getColumn(6).width = 4.13;
		worksheet.getColumn(7).width = 6.88;
		worksheet.getColumn(8).width = 6.88;
		worksheet.getColumn(9).width = 6.88;
		worksheet.getColumn(10).width = 6.88;
		worksheet.getColumn(11).width = 6.88;
		worksheet.getColumn(12).width = 6.88;

		worksheet.getCell("B1").font = {
			name: "맑은 고딕",
			size: 24,
			bold: true
		};

		worksheet.getCell("B1").alignment = {
			horizontal: "center",
			vertical: "middle"
		};

		const headerCells = [ "B9","B10","B12","B13","B15"];

		headerCells.forEach(function(addr){

			const cell = worksheet.getCell(addr);

			cell.fill = {
				type: "pattern",
				pattern: "solid",
				fgColor: {
					argb: "FFD9D9D9"
				}
			};

			cell.font = {
				bold: true,
				size: 10,
				name: "맑은 고딕"
			};
		});

		/////////////////////////////////////////////////////
		// 굵은 외곽선
		/////////////////////////////////////////////////////

		for(let row = 2; row <= 16; row++){

			worksheet.getCell(row,2).border.left = {
				style:"medium"
			};

			worksheet.getCell(row,12).border.right = {
				style:"medium"
			};
		}

		for(let col = 2; col <= 12; col++){

			worksheet.getCell(2,col).border.top = {
				style:"medium"
			};

			worksheet.getCell(16,col).border.bottom = {
				style:"medium"
			};
		}

		/////////////////////////////////////////////////////
		//선제거
		worksheet.getCell(1,2).border = {}
		
		for(let col = 3; col <= 12; col++){
			worksheet.getCell(13,col).border.left = {  };
			worksheet.getCell(14,col).border.left = {  };
			if(col != 12)
			{
				worksheet.getCell(13,col).border.right = {  };
				worksheet.getCell(14,col).border.right = {  };
			}
		}

		//도장 이미지 삽입
		const svgElement = document.querySelector("#approver1_stamp svg");

		const serializer = new XMLSerializer();
		const svgString = serializer.serializeToString(svgElement);

		const pngBase64 = await svgToPng(svgString);

		const imageId = workbook.addImage({
			base64: pngBase64,
			extension: 'png'
		});

		worksheet.addImage(imageId, {
			tl: { col: 6.9, row: 2.9 },
			ext: { width: 42, height: 42 }
		});

		worksheet.getCell(3,7).value = "";

		const buffer = await workbook.xlsx.writeBuffer();

		saveAs(
			new Blob([buffer]), document.getElementById("approvalNo").innerText + "_" + document.getElementById("approver1").innerText + 	".xlsx"
		);
	}

	async function svgToPng(svgText) {
    	return new Promise((resolve) => {
			const svgBlob = new Blob([svgText], {
				type: "image/svg+xml;charset=utf-8"
			});

			const url = URL.createObjectURL(svgBlob);
			const img = new Image();

			img.onload = () => {
				const canvas = document.createElement("canvas");
				canvas.width = img.width;
				canvas.height = img.height;

				const ctx = canvas.getContext("2d");
				ctx.drawImage(img, 0, 0);

				URL.revokeObjectURL(url);

				resolve(
					canvas.toDataURL("image/png")
						.replace(/^data:image\/png;base64,/, "")
				);
			};

			img.src = url;
		});
	}
	</script>
	</head>
	<body>
		<div>
			<button onclick="history.back()">뒤로가기</button>
			<button onclick="exportExcel()">엑셀 출력</button>
		</div>
		<table id="tblData">
			<tr style="height:100px; font-size:2rem; font-weight:bold; width: 100%; text-align:center; border:none;">
				<td colspan="11" style="border:none;">출장신청</td>
			</tr>
			<tr class="border_edge" style="border-top: 3px solid;">
				<td class="header">품의번호</th>
				<td colspan="3" id="approvalNo"></td>
				<td class="header" rowspan="4">결재</td>
				<td class="header" id="approver1"></td>
				<td class="header" id="approver2"></td>
				<td class="header" id="approver3"></td>
				<td class="header" id="approver4"></td>
				<td class="header" id="approver5"></td>
				<td class="header" id="approver6"></td>
			</tr>
			<tr class="border_edge">
				<td class="header">작성일자</th>
				<td colspan="3" id="writeDate"></td>

				<td rowspan="3"></td>

			</tr>
			<tr class="border_edge">

			<tr class="border_edge">

				<td colspan="3" id="writer"></td>
			</tr>
			<tr class="border_edge">
				<td class="header">수신 및 참조</th>
				<td colspan="10"></td>
			</tr>
			<tr class="border_edge">
				<td class="header">제&nbsp;&nbsp;&nbsp;&nbsp;목</th>
				<td colspan="10" id="title" style="text-align: left; font-weight: bold;"></td>
			</tr>
			<tr class="border_edge">
				<td colspan="11"></td>
			</tr>
			<tr class="border_edge">
				<th>프로젝트</th>
				<td colspan="2" id="projectCode"></td>
				<td colspan="8" id="projectName" style="text-align: left;"></td>
			</tr>
			<tr class="border_edge">
				<th>고 객 명</th>
				<td colspan="10" id="customerName" style="text-align: left;"></td>

			<tr class="border_edge">

			<tr class="border_edge">

			</tr>
			<tr class="border_edge">
				<th rowspan="2" >신청기간</th>
				<td style="width:50px;">출발 : </td>
				<td style="width:100px; border-left:hidden;" id="startDate"></td>
				<td style="width:100px; border-left:hidden; text-align: left;" id="startDateTime"></td>
				<td style="width:35px; border-left:hidden;"></td>

				<td style="width:60px; border-left:hidden;"></td>
				<td style="width:60px; border-left:hidden;"></td>
				<td style="width:60px; border-left:hidden;"></td>
				<td style="width:60px; border-left:hidden;"></td>
			</tr>
			<tr class="border_edge">
				<td >도착 : </td>
				<td style="border-left:hidden;" id="endDate"></td>
				<td style="border-left:hidden; text-align: left;"  id="endDateTime"></td>
				<td style="border-left:hidden;"></td>
				<td style="border-left:hidden;"></td>
				<td style="border-left:hidden;"></td>
				<td style="border-left:hidden;"></td>
				<td style="border-left:hidden;"></td>
				<td style="border-left:hidden;"></td>
				<td style="border-left:hidden;"></td>
			</tr>
			<tr class="border_edge">
				<th>출장목적</th>
				<td colspan="10" id="tripPurpose" style="text-align: left;"></td>
			</tr>
			<tr class="border_edge" style="height:400px; border-bottom:3px solid;">
				<td colspan="11"></td>
			</tr>
		</table>
	</body>
</html>
