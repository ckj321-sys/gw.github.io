	function rgbToArgb(rgb) {

		if (!rgb || rgb === 'rgba(0, 0, 0, 0)') {
			return null;
		}

		const match = rgb.match(/\d+/g);

		if (!match) {
			return null;
		}

		return (
			"FF" +
			Number(match[0]).toString(16).padStart(2, "0") +
			Number(match[1]).toString(16).padStart(2, "0") +
			Number(match[2]).toString(16).padStart(2, "0")
		).toUpperCase();
	}

	//엑셀 출력
	async function exportExcel() {

		const table = document.getElementById("tblData");

		const workbook = new ExcelJS.Workbook();
		const worksheet = workbook.addWorksheet("출장복명서");

		const occupied = {};

		function isOccupied(r, c) {
			return occupied[r + "_" + c];
		}

		function markOccupied(sr, sc, er, ec) {

			for (let r = sr; r <= er; r++) {
				for (let c = sc; c <= ec; c++) {
					if (r === sr && c === sc) {
						continue;
					}
					occupied[r + "_" + c] = true;
				}
			}
		}

		let excelRow = 1;

		Array.from(table.rows).forEach(function (tr) {

			let excelCol = 2;

			Array.from(tr.cells).forEach(function (td) {

				while (isOccupied(excelRow, excelCol)) {
					excelCol++;
				}

				const cell = worksheet.getCell(
					excelRow,
					excelCol
				);

				const text = td.innerText.trim().replace(/,/g, '');

				if (text !== '' && !Number.isNaN(Number(text))) {
					cell.value = Number(text);
					cell.numFmt = '#,##0.##';
				}
				else {
					cell.value = td.innerText.trim();
				}

				const style = window.getComputedStyle(td);

				// 폰트
				cell.font = {
					name: "맑은 고딕",
					size: 10,
					bold:
						style.fontWeight === "bold" ||
						parseInt(style.fontWeight) >= 700
				};

				// 정렬
				cell.alignment = {
					vertical: "middle",
					horizontal:
						style.textAlign === "left"
							? "left"
							: style.textAlign === "right"
							? "right"
							: "center",
					wrapText: true
				};

				// 배경색
				const bgColor = rgbToArgb(style.backgroundColor);

				if (bgColor) {

					cell.fill = {
						type: "pattern",
						pattern: "solid",
						fgColor: {
							argb: bgColor
						}
					};
				}

				// 기본 테두리
				cell.border = {
					top: { style: "thin" },
					left: { style: "thin" },
					bottom: { style: "thin" },
					right: { style: "thin" }
				};

				const colSpan = td.colSpan || 1;
				const rowSpan = td.rowSpan || 1;

				// 병합
				if (colSpan > 1 || rowSpan > 1) {

					worksheet.mergeCells(
						excelRow,
						excelCol,
						excelRow + rowSpan - 1,
						excelCol + colSpan - 1
					);

					markOccupied(
						excelRow,
						excelCol,
						excelRow + rowSpan - 1,
						excelCol + colSpan - 1
					);
				}
				excelCol += colSpan;
			});

			worksheet.getRow(excelRow).height = excelRow < 10 ? 20 : 25;
			
			excelRow++;
		});

		//첫째줄, 여백줄 높이설정
		worksheet.getRow(1).height = 60.75;
		worksheet.getRow(12).height = 8;
		worksheet.getRow(18).height = 8;
		worksheet.getRow(34).height = 8;
		
		//너비 설정

		worksheet.getColumn(2).width = 10.38;
		worksheet.getColumn(3).width = 6.75;
		worksheet.getColumn(4).width = 10.63;
		worksheet.getColumn(5).width = 10.63;
		worksheet.getColumn(6).width = 7.88;
		worksheet.getColumn(7).width = 10.63;
		worksheet.getColumn(8).width = 10.63;
		worksheet.getColumn(9).width = 4.13;
		worksheet.getColumn(10).width = 6.88;
		worksheet.getColumn(11).width = 6.88;
		worksheet.getColumn(12).width = 6.88;
		worksheet.getColumn(13).width = 6.88;
		worksheet.getColumn(14).width = 6.88;
		worksheet.getColumn(15).width = 6.88;

		worksheet.getCell("B1").font = {
			name: "맑은 고딕",
			size: 24,
			bold: true
		};

		worksheet.getCell("B1").alignment = {
			horizontal: "center",
			vertical: "middle"
		};

		const headerCells = [ 
			"B13","I13","I15","B14","B15","B17","B19"
			,"B20","C20","F20","G20","H20","I20","J20","K20","N20",
			,"B35"
			,"B36","C36","F36","G36","H36","I36","J36","K36","N36",
			, "B43"
			];

		headerCells.forEach(function(addr){

			const cell = worksheet.getCell(addr);

			cell.fill = {
				type: "pattern",
				pattern: "solid",
				fgColor: {
					argb: "FFD9D9D9"
				}
			};

			cell.font = {
				bold: true,
				size: 10,
				name: "맑은 고딕"
			};
		});

		/////////////////////////////////////////////////////
		// 굵은 외곽선
		/////////////////////////////////////////////////////

		for(let row = 2; row <= 43; row++){

			worksheet.getCell(row,2).border.left = {
				style:"medium"
			};

			worksheet.getCell(row,15).border.right = {
				style:"medium"
			};
		}

		for(let col = 2; col <= 15; col++){

			worksheet.getCell(2,col).border.top = {
				style:"medium"
			};

			worksheet.getCell(43,col).border.bottom = {
				style:"medium"
			};
		}

		/////////////////////////////////////////////////////
		//선제거
		worksheet.getCell(1,2).border = {}
		
		for(let col = 3; col <= 15; col++){
			if(col == 9 && col == 10)
				continue;

			worksheet.getCell(15,col).border.left = {  };
			worksheet.getCell(16,col).border.left = {  };
			if(col != 15)
			{
				worksheet.getCell(15,col).border.right = {  };
				worksheet.getCell(16,col).border.right = {  };
			}
		}

		//도장 이미지 삽입
		const svgElement = document.querySelector("#approver1_stamp svg");

		const serializer = new XMLSerializer();
		const svgString = serializer.serializeToString(svgElement);

		const pngBase64 = await svgToPng(svgString);

		const imageId = workbook.addImage({
			base64: pngBase64,
			extension: 'png'
		});

		worksheet.addImage(imageId, {
			tl: { col: 9.9, row: 2.9 },
			ext: { width: 42, height: 42 }
		});

		worksheet.getCell(3,10).value = "";

		//합계함수 집어넣기
		worksheet.getCell(`K33`).value = {
    		formula: `SUM(K21:M32)`
		};
		//법인카드 합계 함수 넣기
		worksheet.getCell(`K42`).value = { formula: `SUM(K37:M41)`};
		//실수령액 합계 함수 넣기
		worksheet.getCell(`K43`).value = { formula: `K33-K42` };

		const buffer = await workbook.xlsx.writeBuffer();

		saveAs(
			new Blob([buffer]), document.getElementById("approvalNo").innerText + "_" + document.getElementById("approver1").innerText + 	".xlsx"
		);
	}

	async function svgToPng(svgText) {
    	return new Promise((resolve) => {
			const svgBlob = new Blob([svgText], {
				type: "image/svg+xml;charset=utf-8"
			});

			const url = URL.createObjectURL(svgBlob);
			const img = new Image();

			img.onload = () => {
				const canvas = document.createElement("canvas");
				canvas.width = img.width;
				canvas.height = img.height;

				const ctx = canvas.getContext("2d");
				ctx.drawImage(img, 0, 0);

				URL.revokeObjectURL(url);

				resolve(
					canvas.toDataURL("image/png")
						.replace(/^data:image\/png;base64,/, "")
				);
			};

			img.src = url;
		});
	}
